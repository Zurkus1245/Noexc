<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GymBro · Тренер</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#F2EFE6; --bg:#070707; --phone:#0E0E0E; --panel:#121211; --card:#1B1B19; --line:#2A2A28; --mut:#8C8B84;
  --acid:#FF7A1A; --signal:#FF3B6B; --on-acid:#0E0E0E; --peach:#2E9BFF; --peach-soft:#12233D; --peach-line:#1F4A80;
  --act:var(--acid); --act-soft:rgba(255,122,26,.12); --ok:var(--acid); --ok-soft:rgba(255,122,26,.10);
  --warn:var(--signal); --warn-soft:rgba(255,59,107,.12); --bad:var(--signal); --bad-soft:rgba(255,59,107,.14);
  --pause:#B9B7AE; --pause-soft:rgba(185,183,174,.12);
  --d-micro:120ms; --d-short:200ms; --d-med:300ms; --d-long:480ms;
  --e-std:cubic-bezier(.2,0,0,1); --e-exit:cubic-bezier(.4,0,1,1); --e-slice:cubic-bezier(.83,0,.17,1); --e-roll:cubic-bezier(.16,1,.3,1); --e-stamp:cubic-bezier(.34,1.2,.64,1);
  --f-display:Unbounded,Onest,sans-serif; --f-text:Onest,system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
:root[data-theme="light"]{ --peach:#1E6FD0; --peach-soft:rgba(46,155,255,.26); --peach-line:rgba(30,111,208,.4);
  --ink:#0E0E0E; --bg:#E6E2D6; --phone:#F2EFE6; --panel:#ECE8DD; --card:#E4E0D3; --line:#CFCABC; --mut:#6B6A63;
  --acid:#FF7A1A; --act:#0E0E0E; --act-soft:rgba(14,14,14,.07); --ok:#C24E00; --ok-soft:rgba(242,99,0,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
a{cursor:pointer}
::selection{background:var(--acid);color:#0E0E0E}

/* ---------- showcase chrome ---------- */
.app{display:grid;grid-template-columns:260px 1fr 300px;gap:28px;max-width:1300px;margin:0 auto;padding:28px 16px;min-height:100vh}
.side,.notes{background:var(--panel);border:1px solid var(--line);padding:20px;align-self:start;position:sticky;top:28px;max-height:calc(100vh - 56px);overflow:auto}
.side h1{font:900 22px/1 var(--f-display);letter-spacing:-.02em;text-transform:uppercase}
.side h1 b{color:var(--acid);font-weight:900}
:root[data-theme="light"] .side h1 b{color:var(--signal)}
.side .sub{color:var(--mut);font:11px/1.5 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 18px}
.grp{font:700 10px var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:18px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.nav button{display:flex;gap:10px;width:100%;text-align:left;padding:7px 8px;font-size:13px;position:relative;transition:background var(--d-short) var(--e-std)}
.nav button span{color:var(--mut);font:500 11px/1.9 var(--f-mono);min-width:20px}
.nav button:hover{background:var(--card)}
.nav button.on{background:var(--ink);color:var(--phone);font-weight:600}
.nav button.on span{color:var(--phone)}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.ctrl{display:flex;gap:6px;align-items:center}
.ctrl button{background:var(--panel);border:1px solid var(--line);padding:9px 14px;font:700 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;transition:transform var(--d-micro) linear}
.ctrl button:active{transform:scale(.96)}
.ctrl .pos{color:var(--mut);font:500 12px var(--f-mono);min-width:70px;text-align:center}
.phone{width:375px;height:790px;background:var(--phone);border-radius:46px;border:11px solid #000;position:relative;overflow:hidden;box-shadow:0 0 0 1px #2a2a28,0 40px 80px -30px rgba(0,0,0,.8)}
.status{height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font:700 12px var(--f-mono)}
.scr{position:absolute;top:42px;left:0;right:0;bottom:0;display:flex;flex-direction:column}
.body{counter-reset:o;flex:1;overflow:auto;padding:6px 18px 20px}
.body::-webkit-scrollbar{display:none}
.notes .who{font:700 10px var(--f-mono);color:var(--mut);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}
.notes h2{font:800 16px/1.2 var(--f-display);text-transform:uppercase;margin-bottom:14px}
.notes ul{list-style:none;font-size:13px;counter-reset:n}
.notes li{margin-bottom:10px;padding-left:28px;position:relative;counter-increment:n}
.notes li:before{content:counter(n,decimal-leading-zero);position:absolute;left:0;top:1px;font:700 11px var(--f-mono);color:var(--acid)}
:root[data-theme="light"] .notes li:before{color:var(--signal)}
.notes .tz{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font:11px/1.5 var(--f-mono);color:var(--mut);text-transform:uppercase}

/* ---------- type ---------- */
.h1{font:800 25px/1.08 var(--f-display);letter-spacing:-.02em;text-transform:uppercase}
.h2{font:800 16px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:-.01em}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:11px}
.lbl,.xs.mut{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.04em;font-size:10.5px}
.big{font:900 46px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;display:inline-block}
b{font-weight:700}

/* ---------- layout ---------- */
.row{display:flex;align-items:center;gap:10px} .sb{justify-content:space-between} .col{display:flex;flex-direction:column}
.gap8>*+*{margin-top:8px} .gap12>*+*{margin-top:12px} .gap16>*+*{margin-top:16px}

/* ---------- surfaces ---------- */
.card{background:var(--card);border-radius:2px;padding:14px;border-left:2px solid transparent}
.card.out{background:transparent;border:1px solid var(--line)}
.card.hero{background:var(--ink);color:var(--phone);padding:18px;clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
.card.hero .pill{background:var(--phone)!important;color:var(--ink)}
.card.hero .btn.p{background:var(--acid);color:#0E0E0E}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:0;font:700 13px var(--f-text);text-transform:uppercase;letter-spacing:.08em;width:100%;transition:transform var(--d-micro) linear,background var(--d-short),color var(--d-short)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.p{background:var(--acid);color:#0E0E0E}
.btn.p:after{content:"→";font-family:var(--f-mono);font-weight:500;transition:transform var(--d-short) var(--e-std)}
.btn.p:hover:after{transform:translateX(4px)}
.btn.p:disabled{background:var(--card);color:var(--mut);cursor:default}
.btn.p:disabled:after{opacity:.3}
.btn.s{border:1.5px solid var(--line);background:transparent}
.btn.s:hover{border-color:var(--ink)}
.btn.t{height:42px;color:var(--mut);font-size:11px}
.btn.ok{background:var(--acid);color:#0E0E0E}
.btn.dark{background:var(--ink);color:var(--phone)}
:root[data-theme="light"] .btn.p,:root[data-theme="light"] .btn.ok{background:#0E0E0E;color:var(--acid)}

/* ---------- tags ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font:700 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:4px 7px;border-radius:0;white-space:nowrap;border:1px solid currentColor;background:transparent!important}
.pill.ok{color:var(--ok)} .pill.warn,.pill.bad{color:var(--signal)} .pill.act{color:var(--act)}
.pill.pause{color:var(--pause)} .pill.mut{color:var(--mut)}
.pill.ok:before{content:"";width:6px;height:6px;background:currentColor}
.pill.bad:before,.pill.warn:before{content:"";width:6px;height:6px;background:currentColor;transform:rotate(45deg)}
.av{width:40px;height:40px;border-radius:0;display:grid;place-items:center;font:800 13px var(--f-display);background:var(--ink);color:var(--phone);flex:none}
.av.lg{width:72px;height:72px;font-size:22px}

/* ---------- segmented bar ---------- */
.bar{height:10px;background:var(--line);position:relative;overflow:hidden;
 -webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 3px),transparent calc(10% - 3px) 10%);mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 3px),transparent calc(10% - 3px) 10%)}
.bar i{display:block;height:100%;background:var(--acid)!important;transform-origin:left;animation:grow var(--d-long) var(--e-std) both .1s}
:root[data-theme="light"] .bar i{background:#0E0E0E!important}
.bar.sig i{background:var(--signal)!important}

/* ---------- tab bar ---------- */
.tabs{display:flex;border-top:1px solid var(--line);padding:0 4px 16px;background:var(--phone)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 9px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding-top:10px;position:relative;transition:color var(--d-short)}
.tabs button:before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--acid);transform:scaleX(0);transition:transform var(--d-med) var(--e-std)}
.tabs button svg{width:22px;height:22px;stroke-linecap:square;stroke-linejoin:miter}
.tabs button.on{color:var(--ink)}
.tabs button.on:before{transform:scaleX(1)}
:root[data-theme="light"] .tabs button:before{background:#0E0E0E}

/* ---------- header / progress ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 10px;min-height:44px}
.back{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);font:500 16px var(--f-mono)}
.prog{display:flex;gap:3px;flex:1;margin:0 12px}
.prog i{flex:1;height:4px;background:var(--line);position:relative;overflow:hidden}
.prog i.on:after{content:"";position:absolute;inset:0;background:var(--acid);transform-origin:left;animation:grow var(--d-med) var(--e-std) both}
:root[data-theme="light"] .prog i.on:after{background:#0E0E0E}

/* ---------- options & inputs ---------- */
.opts{counter-reset:o}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 14px;border:1.5px solid var(--line);margin-bottom:8px;counter-increment:o;transition:border-color var(--d-short),background var(--d-short),transform var(--d-micro) linear}
.opt:active{transform:scale(.985)}
.opt .em{font:800 13px var(--f-mono);width:26px;color:var(--mut);font-size:0}
.opt .em:before{content:counter(o,decimal-leading-zero);font-size:13px}
.opt.on{border-color:var(--acid);background:var(--act-soft)}
.opt.on .em{color:var(--acid)}
:root[data-theme="light"] .opt.on{border-color:#0E0E0E}
:root[data-theme="light"] .opt.on .em{color:#0E0E0E}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:9px 12px;border:1.5px solid var(--line);font:700 11px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;transition:all var(--d-short) var(--e-std)}
.chip.on{background:var(--ink);color:var(--phone);border-color:var(--ink)}
.field{background:var(--card);padding:10px 14px;border-bottom:2px solid var(--line);transition:border-color var(--d-short)}
.field:focus-within{border-color:var(--acid)}
.field label{font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);display:block}
.field input{border:0;background:none;outline:none;font:800 18px var(--f-display);width:100%}
.chk{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;background:var(--card);width:100%;transition:background var(--d-short)}
.chk .box{width:22px;height:22px;border:2px solid var(--mut);flex:none;display:grid;place-items:center;color:#0E0E0E;font-weight:900;font-size:13px;transition:all var(--d-short) var(--e-std)}
.chk.on .box{background:var(--acid);border-color:var(--acid);animation:pop var(--d-short) var(--e-stamp)}
.seg{display:flex;border:1.5px solid var(--line)}
.seg button{flex:1;padding:8px 6px;font:700 10px var(--f-mono);text-transform:uppercase;color:var(--mut);transition:all var(--d-short)}
.seg button.on{background:var(--ink);color:var(--phone)}

/* ---------- sheets / toast ---------- */
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:5;animation:fade var(--d-short) linear both}
.sheet>div{background:var(--phone);width:100%;padding:22px 18px 30px;border-top:2px solid var(--acid);animation:up var(--d-med) var(--e-std) both}
.toast{position:absolute;left:16px;right:16px;bottom:92px;background:var(--acid);color:#0E0E0E;padding:13px 14px;font:700 11px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;z-index:6;animation:up var(--d-med) var(--e-std) both}

/* ---------- workout ---------- */
.set{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:8px;align-items:center;padding:8px 10px;border-left:2px solid transparent;transition:background var(--d-short)}
.set.cur{background:var(--card);border-left-color:var(--acid)}
.set.done{color:var(--mut)}
.set .n{font:700 12px var(--f-mono);color:var(--mut)}
.set .v{font:800 15px var(--f-display)}
.tick{width:42px;height:42px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;transition:all var(--d-short)}
.set.done .tick{background:var(--acid);border-color:var(--acid);color:#0E0E0E}
.set.just .tick{animation:pop var(--d-short) var(--e-stamp)}
.set.just{animation:flash 240ms steps(2,end)}
.step{width:48px;height:48px;border:1.5px solid var(--line);font:500 22px var(--f-mono);transition:transform var(--d-micro) linear,border-color var(--d-short)}
.step:active{transform:scale(.92);border-color:var(--acid)}
.roll{animation:roll 380ms var(--e-roll)}

/* ---------- misc ---------- */
.ring{position:relative;width:150px;height:150px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring svg circle+circle{stroke-linecap:butt!important;animation:ring 900ms var(--e-std) both .1s}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-family:var(--f-display)!important;font-weight:900!important}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.tl{position:relative;padding-left:24px}
.tl>div{position:relative;padding-bottom:14px}
.tl>div:before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;background:var(--phone);border:1.5px solid var(--mut)}
.tl>div.on:before{background:var(--acid);border-color:var(--acid)} .tl>div.done:before{background:var(--ink);border-color:var(--ink)}
.tl:before{content:"";position:absolute;left:9px;top:8px;bottom:18px;width:1px;background:var(--line)}
.qr{width:160px;height:160px;margin:0 auto;background:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 50%) 0 0/20px 20px;border:12px solid var(--phone);outline:1px solid var(--line)}
.switch{width:51px;height:31px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background 250ms var(--e-std)}
.switch:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25),0 1px 1px rgba(0,0,0,.16);transition:transform 300ms cubic-bezier(.3,1.3,.6,1),width 200ms var(--e-std)}
.switch.on{background:var(--peach)} .switch.on:after{transform:translateX(20px)} .switch:active:after{width:32px} .switch.on:active:after{transform:translateX(15px)}
.danger{color:var(--signal);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font:10px var(--f-mono);text-transform:uppercase;color:var(--mut);margin-top:8px}
.strike{position:relative;white-space:nowrap}
.strike:after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:2px;background:var(--signal);transform-origin:left;animation:grow 420ms cubic-bezier(.7,0,.2,1) both .25s}
.stamp{display:inline-block;font:900 40px/1 var(--f-display);text-transform:uppercase;letter-spacing:-.03em;padding:8px 14px;background:var(--acid);color:#0E0E0E;transform:rotate(-3deg);animation:stamp 260ms var(--e-stamp) both .1s}
.mega{font:900 58px/.9 var(--f-display);letter-spacing:-.04em;text-transform:uppercase;margin-left:-3px}
.mega em{font-style:normal;color:var(--acid)}
:root[data-theme="light"] .mega em{color:var(--signal)}
.idx{font:700 11px var(--f-mono);color:var(--mut);letter-spacing:.08em}
.chart path{stroke:var(--acid)!important;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 700ms var(--e-std) forwards .15s}
.chart circle{fill:var(--acid)!important;animation:pop var(--d-med) var(--e-stamp) both .8s;transform-box:fill-box;transform-origin:center}
:root[data-theme="light"] .chart path{stroke:#0E0E0E!important} :root[data-theme="light"] .chart circle{fill:#0E0E0E!important}
.restbar{height:14px;background:var(--line);margin:18px 0 6px;overflow:hidden}
.restbar i{display:block;height:100%;background:var(--acid);transition:width 1s linear,background var(--d-med)}
.restbar.low i{background:var(--signal)}

/* ---------- screen transitions ---------- */
.scr.fwd>*:not(.toast){animation:inR var(--d-med) var(--e-std) both}
.scr.bwd>*:not(.toast){animation:inL var(--d-med) var(--e-std) both}
.scr.fwd .h1,.scr.bwd .h1{animation:reveal 520ms var(--e-roll) both .06s}
.scr.fwd .body>*{animation:rise 360ms var(--e-std) both}
.scr.fwd .body>*:nth-child(2){animation-delay:30ms}.scr.fwd .body>*:nth-child(3){animation-delay:60ms}
.scr.fwd .body>*:nth-child(4){animation-delay:90ms}.scr.fwd .body>*:nth-child(5){animation-delay:120ms}
.scr.fwd .body>*:nth-child(n+6){animation-delay:150ms}
/* re-render on same screen: no entrance replays */
.scr.still .bar i,.scr.still .prog i.on:after,.scr.still .ring svg circle+circle,.scr.still .chart path,.scr.still .chart circle,
.scr.still .strike:after,.scr.still .stamp,.scr.still .chk.on .box{animation:none}
.scr.still .chart path{stroke-dashoffset:0}
.scr.still .chk.on.just .box{animation:pop var(--d-short) var(--e-stamp)}
.scr.still.sheet-still .sheet,.scr.still.sheet-still .sheet>div{animation:none}


/* ---------- warm accent: people, records, streak ---------- */
.av{background:var(--peach);color:#0E0E0E}
.warm{color:var(--peach)}
.pill.pr{color:var(--peach)}
.pill.pr:before{content:"★";font-size:10px;line-height:1}
.card.pr{background:var(--peach-soft);border-left-color:var(--peach);position:relative;overflow:hidden}
.card.coach{background:var(--peach-soft);border-left-color:var(--peach)}
.streak{display:inline-flex;align-items:center;gap:6px;font:700 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--peach)}
.streak i{width:8px;height:12px;background:var(--peach);clip-path:polygon(50% 0,100% 60%,75% 100%,25% 100%,0 60%);animation:flicker 1.6s ease-in-out 2}
.spark{position:absolute;bottom:14px;width:4px;height:4px;background:var(--peach);opacity:0;animation:spark 700ms var(--e-std) forwards}
.spark:nth-of-type(1){left:22px;animation-delay:.35s}.spark:nth-of-type(2){left:34px;animation-delay:.45s}
.spark:nth-of-type(3){left:28px;animation-delay:.55s}.spark:nth-of-type(4){left:40px;animation-delay:.62s}
.scr.still .spark,.scr.still .streak i{animation:none}
@keyframes spark{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(.4)}}
@keyframes flicker{50%{transform:scaleY(.8) translateY(1px);opacity:.75}}

/* ---------- peach = «выбрано / я здесь / моё / люди» ---------- */
.field:focus-within{border-color:var(--peach)}
.opt.on,:root[data-theme="light"] .opt.on{border-color:var(--peach);background:var(--peach-soft)}
.opt.on .em,:root[data-theme="light"] .opt.on .em{color:var(--peach)}
.chip.on{background:var(--peach-soft);color:var(--peach);border-color:var(--peach-line)}
.seg button.on{background:var(--peach-soft);color:var(--peach);box-shadow:inset 0 -2px 0 var(--peach)}
.chk.on .box{background:var(--peach);border-color:var(--peach)}
.chk.on{background:var(--peach-soft)}
.tabs button:before,:root[data-theme="light"] .tabs button:before{background:var(--peach)}
.tabs button.on{color:var(--peach)}
.prog i.on:after,:root[data-theme="light"] .prog i.on:after{background:var(--peach)}
.tl>div.on:before{background:var(--peach);border-color:var(--peach)}
.bar.pe i{background:var(--peach)!important}
.card.coach{border:1px solid var(--peach-line);border-left:2px solid var(--peach)}
.chart path,:root[data-theme="light"] .chart path{stroke:var(--peach)!important}
.chart circle{fill:var(--acid)!important}
.nav button.on{box-shadow:inset 3px 0 0 var(--peach)}
.notes li:before,:root[data-theme="light"] .notes li:before{color:var(--peach)}

<style id="v4">
/* =========================================================

     B  = electric blue (hue ~208°) → люди, тренер, «моё», рекорды

   Motion: Disney's 12 principles, adapted for UI
   ========================================================= */
:root{
  --A:#FF7A1A; --A-l:#FFA15C; --A-d:#E05A00; --A-on:#1A0D03; --A-soft:rgba(255,122,26,.13);

  --danger:#FF3B6B;
  --bg:#0A0D16; --phone:#0C101A; --card:#131826; --line:rgba(150,175,255,.09); --hl:rgba(190,210,255,.08);

<style id="v5">

   ========================================================= */

.bar i{animation:grow 900ms var(--e-soft) both .1s!important}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<style id="liquid-glass">
/* =========================================================
   GymBro · Liquid Glass

  --A-glass:linear-gradient(180deg,rgba(255,150,80,.96),rgba(255,122,26,.92));
  --r-sm:12px;--r-md:20px;--r-lg:28px;
  --f-display:'Oswald','Arial Narrow',sans-serif;--f-text:'Golos Text',-apple-system,'SF Pro Text',system-ui,sans-serif;

  radial-gradient(60% 50% at 20% 0%,rgba(255,122,26,.10),transparent 70%),
  radial-gradient(60% 60% at 100% 100%,rgba(46,155,255,.10),transparent 70%),var(--bg)!important}

<style id="wwdc-liquid-glass">
/* =========================================================
   Liquid Glass по WWDC25 «Meet Liquid Glass»
   1. Линзирование (преломление), а не просто размытие: SVG-фильтр #lg в backdrop-filter.
   2. Стекло ТОЛЬКО на слое навигации/управления. Контент — обычные заливки. Никакого стекла на стекле.
   3. Блик (specular) реагирует на геометрию и движется вслед за светом/касанием.
   4. Касание: стекло пружинит как гель и подсвечивается от точки касания.
   5. Появление: стекло «материализуется» через нарастание преломления, а не fade.
   6. Края прокрутки: контент мягко растворяется под стеклянными панелями.
   7. Цвет (tint) — только у главного действия.
   ========================================================= */

/* ---- 2. content layer: plain fills, no glass ---- */
.card,.card.pr,.card.coach,.idplate,.opt,.field,.chk,.av,.tile-ic,.set.cur,.card.hero,
:root[data-theme="light"] .card,:root[data-theme="light"] .card.hero,:root[data-theme="light"] .card.pr,:root[data-theme="light"] .card.coach{
  background:rgba(255,255,255,.055)!important;border:1px solid rgba(255,255,255,.07)!important;
  box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
:root[data-theme="light"] :is(.card,.card.hero,.card.pr,.card.coach,.idplate,.opt,.field,.chk,.av,.tile-ic,.set.cur){
  background:#FFFFFF!important;border:1px solid rgba(0,0,0,.06)!important}
.card.pr,.card.coach,.idplate{border-left:3px solid var(--B)!important}
.opt.on,:root[data-theme="light"] .opt.on{background:rgba(255,255,255,.12)!important;border-color:rgba(255,255,255,.5)!important}
:root[data-theme="light"] .opt.on{background:#fff!important;border-color:#1C1D20!important}
.field:focus-within,.dob-f:focus-within,.unit-f:focus-within,.name-field:focus-within{box-shadow:0 0 0 2px var(--ink)!important}

/* ---- 1. control layer: lensing glass ---- */
.tabs,.btn.s,.back,.step,.seg,.toast,.sheet>div,.chip,.tick,.ctrl button,.name-clear,.bubble,.push,button.pill{
  --lx:50%;--ly:0%;
  position:relative;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03))!important;
  border:1px solid rgba(255,255,255,.22)!important;
  backdrop-filter:blur(3px) saturate(170%) brightness(1.06)!important;
  -webkit-backdrop-filter:blur(3px) saturate(170%) brightness(1.06)!important;
  backdrop-filter:url(#lg) blur(1.5px) saturate(170%) brightness(1.06)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),           /* верхний блик кромки */
    inset 0 -1px 0 rgba(255,255,255,.12),          /* нижнее преломление */
    inset 0 0 0 .5px rgba(255,255,255,.18),
    0 8px 24px -10px rgba(0,0,0,.55)!important}     /* тень, отделяющая от контента */
:root[data-theme="light"] :is(.tabs,.btn.s,.back,.step,.seg,.toast,.sheet>div,.chip,.tick,.ctrl button,.name-clear,.bubble,button.pill){
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.25))!important;
  border-color:rgba(255,255,255,.95)!important;
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.6),0 0 0 .5px rgba(0,0,0,.08),0 10px 26px -12px rgba(0,0,0,.28)!important}
/* thicker glass (bigger surfaces) = stronger lensing & deeper shadow */
.tabs,.sheet>div{backdrop-filter:url(#lg-thick) blur(2px) saturate(180%) brightness(1.04)!important}
.tabs{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),0 18px 40px -14px rgba(0,0,0,.7)!important}

/* ---- 3. specular highlight that follows light / pointer ---- */
.tabs:before,.btn.s:before,.btn.p:before,.back:before,.step:before,.seg:before,.chip:before,.tick:before,.toast:before,.ctrl button:before{
  content:""!important;display:block!important;position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:radial-gradient(120px 60px at var(--lx,50%) var(--ly,0%),rgba(255,255,255,.38),transparent 70%)!important;
  mix-blend-mode:overlay;opacity:.9;transition:opacity 300ms var(--e-soft);animation:none!important;left:0!important;top:0!important;width:auto!important;height:auto!important;transform:none!important}
/* rim light: thin bright edge, stronger on the lit side */
.tabs:after,.btn.s:after,.back:after,.seg:after{content:""!important;position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;z-index:2;
  background:conic-gradient(from 200deg at var(--lx,50%) var(--ly,0%),rgba(255,255,255,.7),rgba(255,255,255,.05) 25%,rgba(255,255,255,.05) 75%,rgba(255,255,255,.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55}

/* ---- 7. tint only the primary action ---- */
.btn.p,.btn.ok{position:relative;isolation:isolate;overflow:hidden}

/* ---- 4. touch: gel flex + glow from the touch point ---- */
.lg-press{transform:scale(1.035,.965)!important;transition:transform 140ms cubic-bezier(.3,0,.4,1)!important}
.lg-release{transition:transform 560ms cubic-bezier(.2,1.6,.4,1)!important}
.lg-glow{position:absolute;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;pointer-events:none;z-index:3;
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 65%);mix-blend-mode:overlay;animation:lgGlow 650ms var(--e-soft) forwards}
@keyframes lgGlow{0%{opacity:0;transform:scale(.3)}25%{opacity:1}100%{opacity:0;transform:scale(1.4)}}

/* ---- 5. materialize: glass appears by ramping refraction, not by fading ---- */
.scr.fwd .tabs,.scr.bwd .tabs,.sheet>div,.toast{animation:lgMaterialize 520ms var(--e-enter) both!important}
@keyframes lgMaterialize{0%{backdrop-filter:blur(0) saturate(100%) brightness(1);transform:scale(.97);box-shadow:none}100%{transform:none}}
.scr.still .tabs,.scr.still.sheet-still .sheet>div,.scr.toast-still .toast{animation:none!important}

/* ---- 6. scroll edge effect: content dissolves under glass bars ---- */
.body{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 28px),transparent 100%)}

/* accessibility (по WWDC): Reduced Transparency → матовее; Increased Contrast → чёткая граница */
@media (prefers-reduced-transparency:reduce){:is(.tabs,.btn.s,.back,.step,.seg,.toast,.sheet>div,.chip,.tick){backdrop-filter:blur(30px)!important;background:rgba(40,40,44,.92)!important}}
@media (prefers-contrast:more){:is(.tabs,.btn.s,.back,.step,.seg,.toast,.sheet>div,.chip,.tick){border:1.5px solid currentColor!important}}
</style>

/* textured backdrop inside the phone (neutral, but refractable) */
.phone{background-color:#0D0D0F!important}

  background:radial-gradient(120% 55% at 50% -12%,rgba(255,255,255,.22),rgba(255,255,255,.06) 45%,transparent 75%),linear-gradient(180deg,#18181B,#0A0A0B)}
:root[data-theme="light"] .scr:before{background:radial-gradient(120% 55% at 50% -12%,#FFFFFF,rgba(255,255,255,.5) 45%,transparent 75%),linear-gradient(180deg,#F1F1F4,#DDDEE3)}
.scr{isolation:isolate}

/* ---- glass everywhere: controls AND content (cards, lists, fields) ---- */
.card,.card.pr,.card.coach,.idplate,.card.hero,.opt,.field,.chk,.set.cur,.tile-ic,.av,
.tabs,.btn.s,.back,.step,.seg,.toast,.sheet>div,.chip,.tick,.name-clear,.bubble,button.pill,
:root[data-theme="light"] :is(.card,.card.hero,.card.pr,.card.coach,.idplate,.opt,.field,.chk,.set.cur,.tile-ic,.av){

  border:1px solid rgba(255,255,255,.18)!important;
  -webkit-backdrop-filter:blur(2px) saturate(160%)!important;

    0 10px 30px -12px rgba(0,0,0,.6)!important}
/* bigger panels = thicker glass = stronger edge bend */
.card,.card.hero,.tabs,.sheet>div,.seg{backdrop-filter:url(#lgE-thick) blur(.8px) saturate(170%) brightness(1.05)!important}
:root[data-theme="light"] :is(.card,.card.pr,.card.coach,.idplate,.card.hero,.opt,.field,.chk,.set.cur,.tile-ic,.av,.tabs,.btn.s,.back,.step,.seg,.toast,.sheet>div,.chip,.tick,.name-clear,.bubble,button.pill){

  border-color:rgba(255,255,255,.95)!important;
  box-shadow:inset 0 1.5px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.7),0 0 0 .5px rgba(0,0,0,.07),0 12px 30px -14px rgba(0,0,0,.3)!important}

<style id="lg-soft-ios">
/* =========================================================
   iOS-style SOFT Liquid Glass, согласованный со светом сверху.
   - Свет только сверху (как на фоне): светлая кромка и мягкое внутреннее сияние сверху,
     снизу едва заметный отражённый свет. Блик НЕ ходит за курсором.
   - Нет жёстких рамок и «линии глянца» посередине: всё плавные градиенты.
   - Линза мягкая: лёгкое увеличение у края, без «водяной» ряби.
   - Тень большая и мягкая, а не обводка.
   ========================================================= */
:root{
 --lg-fill:linear-gradient(180deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,.035) 45%,rgba(255,255,255,.02) 100%);
 --lg-edge:inset 0 1px 0 rgba(255,255,255,.26),inset 0 0 0 .5px rgba(255,255,255,.07),inset 0 -1px 0 rgba(255,255,255,.035);
 --lg-glow:inset 0 14px 22px -16px rgba(255,255,255,.22),inset 0 -10px 18px -14px rgba(255,255,255,.06);
 --lg-drop:0 14px 34px -18px rgba(0,0,0,.6),0 2px 6px -2px rgba(0,0,0,.25);
 --lg-bf:blur(8px) saturate(180%) brightness(1.06);
}
:root[data-theme="light"]{
 --lg-fill:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.34) 45%,rgba(255,255,255,.26) 100%);
 --lg-edge:inset 0 1px 0 rgba(255,255,255,1),inset 0 0 0 .5px rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.5);
 --lg-glow:inset 0 14px 22px -16px rgba(255,255,255,.9),inset 0 -10px 18px -14px rgba(0,0,0,.04);
 --lg-drop:0 14px 34px -20px rgba(15,20,35,.28),0 1px 3px rgba(15,20,35,.06);
 --lg-bf:blur(10px) saturate(170%) brightness(1.04);
}
:is(.card,.card.pr,.card.coach,.idplate,.card.hero,.opt,.field,.chk,.set.cur,.tile-ic,.av,.tabs,.btn.s,.back,.step,.seg,.toast,.sheet>div,.chip,.tick,.name-clear,.bubble,button.pill,.ctrl button),
:root[data-theme="light"] :is(.card,.card.pr,.card.coach,.idplate,.card.hero,.opt,.field,.chk,.set.cur,.tile-ic,.av,.tabs,.btn.s,.back,.step,.seg,.toast,.sheet>div,.chip,.tick,.name-clear,.bubble,button.pill,.ctrl button){
  background:var(--lg-fill)!important;border:0!important;

:is(.card,.card.hero,.tabs,.sheet>div){backdrop-filter:url(#lgE-thick) var(--lg-bf)!important}

:root[data-theme="light"] .opt.on{background:linear-gradient(180deg,#fff,rgba(255,255,255,.75))!important;box-shadow:inset 0 0 0 1.5px rgba(20,20,24,.55),var(--lg-drop)!important}
.field:focus-within,.dob-f:focus-within,.unit-f:focus-within,.name-field:focus-within{box-shadow:var(--lg-edge),inset 0 0 0 1px rgba(255,255,255,.35),var(--lg-drop)!important}
:root[data-theme="light"] :is(.field,.dob-f,.unit-f,.name-field):focus-within{box-shadow:var(--lg-edge),inset 0 0 0 1.5px rgba(20,20,24,.45),var(--lg-drop)!important}

:is(.tabs,.btn.s,.back,.seg):after{content:none!important;display:none!important}
/* primary action: smooth glossy pill, no hard midline */
.btn.p,.btn.ok{background:linear-gradient(180deg,#FFFFFF 0%,#EDEEF1 55%,#E1E2E6 100%)!important;color:#111214!important;border:0!important;
  box-shadow:inset 0 1px 0 #fff,inset 0 -6px 12px -8px rgba(0,0,0,.18),0 14px 30px -16px rgba(0,0,0,.6)!important}
:root[data-theme="light"] .btn.p,:root[data-theme="light"] .btn.ok{background:linear-gradient(180deg,#3A3B40 0%,#232428 55%,#1A1B1E 100%)!important;color:#fff!important;

function applyTpl(id,shift){const t=S.templates.find(x=>x.id==id);const d=clone(t.days);d.forEach(x=>x.ex.forEach(e=>e.w=Math.round(e.w*(1+shift)/2.5)*2.5));C().plan=d;S.eday=0;S.dirty=true;U.sheet=null;toast(`Шаблон «${t.n}» применён${shift?` · веса ${shift>0?'+':''}${shift*100}%`:''}`)}
function saveTpl(){const c=C();if(!c.plan.length)return toast('Пустой план нельзя сохранить');S.templates.push({id:'tp'+Date.now(),n:`План ${first(c)} · ${c.plan.length} дн`,days:clone(c.plan)});U.sheet=null;toast('Сохранено в шаблоны')}
function kcalAdj(d){C().kcalAdj+=d;S.dirty=true;commit()}
function publish(){const c=C();if(!c.plan.length)return toast('Добавь хотя бы один день');c.ver++;S.dirty=false;if(c.status=='waiting'||c.status=='new')c.status='active';c.planned=c.plan.length;c.msgs.push(['sys',`План обновлён · версия ${c.ver}`,'сейчас']);toast(`${first(c)} получил план v${c.ver} · push отправлен`)}
/* chat */
const QUICK=['Отлично, так держать','Пришли видео техники','Сегодня делаем легче','Замени упражнение на жим ногами','Как самочувствие?'];
function draftIn(el){S.draft=el.value;save()}
function send(t){const c=CH();const txt=(t??S.draft).trim();if(!txt)return;c.msgs.push(['me',txt,'сейчас']);S.draft='';commit();
 const R={'Как самочувствие?':'Норм, колено лучше','Пришли видео техники':'Ок, вечером запишу'};clearTimeout(U.rt);U.rt=setTimeout(()=>{c.msgs.push(['them',R[txt]||'Понял, спасибо!','сейчас']);if(S.scr!='t-thread'||S.chat!=c.id)c.unread++;commit()},1400)}

function withdraw(){if(!S.payout)return openSheet('payout');if(S.balance<1000)return toast('Минимум для вывода 1 000 ₽');S.history.unshift(['Вывод на карту',-S.balance,'сегодня']);const b=S.balance;S.balance=0;toast(`${fmt(b)} ₽ уйдут на карту ${S.payout} за 1–2 дня`)}
function savePayout(){const v=document.getElementById('payIn').value.replace(/\D/g,'');if(v.length<4)return toast('Нужны хотя бы последние 4 цифры');S.payout='•• '+v.slice(-4);U.sheet=null;toast('Карта для выплат сохранена')}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='gymbro:v1:'+APP;
let S;
function loadState(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===VER)return o}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){/* file:/data: — memory only */}}
function resetDemo(){S=seed();try{localStorage.removeItem(KEY)}catch(e){}U.hist=[];U.sheet=null;U.focus=null;U.pmode=null;U.pf=null;U.bdone=false;lastI=-1;toast('Демо сброшено');}
S=loadState();
const U={hist:[],sheet:null,toast:null,tt:0,dir:0};
const idx=id=>SCREENS.findIndex(s=>s.id==id);
const cur=()=>SCREENS[Math.max(0,idx(S.scr))];
/* navigation */
function go(id,push=true){if(idx(id)<0)return console.warn('no screen',id);if(push&&S.scr!==id)U.hist.push(S.scr);U.sheet=null;S.scr=id;commit();document.querySelector('.body')?.scrollTo(0,0)}
function back(fallback){const p=U.hist.pop();go(p||fallback||SCREENS[0].id,false)}
function tab(id){U.hist=[];go(id,false)}
function next(){const i=idx(S.scr);if(i<SCREENS.length-1)go(SCREENS[i+1].id)}
function prev(){const i=idx(S.scr);if(i>0)go(SCREENS[i-1].id)}
function commit(){save();render()}
/* sheets & toast */
function openSheet(k,p={}){U.sheet={k,...p};render()}
function closeSheet(){U.sheet=null;render()}
function toast(t){U.toast=t;render();clearTimeout(U.tt);U.tt=setTimeout(()=>{U.toast=null;render()},2600)}
function sheetWrap(inner){return `<div class="sheet" onclick="if(event.target==this)closeSheet()"><div class="gap12" role="dialog" aria-modal="true">${inner}</div></div>`}
/* shared UI bits */
const hdr=(mid='',right='',fb)=>`<div class="top"><button class="back" aria-label="Назад" onclick="back('${fb||''}')">${I.back}</button>${mid}${right||'<span style="width:36px"></span>'}</div>`;

const toggle=(on,fn,label)=>`<button class="tgl ${on?'on':''}" role="switch" aria-checked="${!!on}" aria-label="${label||''}" onclick="${fn}"><i></i></button>`;

const kg=v=>v==null?'—':String(Math.round(v*10)/10).replace('.',',');
function spark(arr,h=90){if(!arr||arr.length<2)return `<div class="sm mut" style="padding:20px 0;text-align:center">Нужно минимум 2 замера, чтобы показать тренд</div>`;
 const mn=Math.min(...arr)-.3,mx=Math.max(...arr)+.3,W=300,st=W/(arr.length-1),y=v=>h-((v-mn)/(mx-mn))*(h-14)-7;

 return `<svg viewBox="0 0 ${W} ${h}" class="spark" preserveAspectRatio="none"><path d="${d} L${W} ${h} L0 ${h}Z" class="spark-a"/><path d="${d}" class="spark-l"/>${arr.map((v,i)=>i==arr.length-1?`<circle cx="${i*st}" cy="${y(v)}" r="4" class="spark-d"/>`:'').join('')}</svg>`}
/* Mifflin–St Jeor */
function kcalFor(p){if(!p.w||!p.h||!p.age)return null;const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex=='m'?5:-161);const k={cut:.82,bulk:1.1,keep:1,strength:1.05}[p.goal]??1;return Math.round((bmr*(p.act||1.55)*k+(p.kcalAdj||0))/10)*10}

 document.getElementById('notes').innerHTML=`<div class="who">Почему так · консилиум</div><h2>${s.t}</h2><ul>${s.notes.map(n=>`<li>${n}</li>`).join('')}</ul><div class="tz">${s.tz||''}</div><div class="state-peek"><div class="who" style="margin-top:18px">Живые данные</div>${PEEK()}</div>`;
}
/* dead-button self test: every button must have a handler or be disabled */
function selfTest(){const bad=[];document.querySelectorAll('#scr button,#scr [role=button]').forEach(b=>{if(!b.disabled&&!b.getAttribute('onclick')){bad.push((b.textContent||b.ariaLabel||'?').trim().slice(0,40));b.style.outline='2px dashed red'}});return bad}
function selfTestAll(){const keep=S.scr,out={};SCREENS.forEach(s=>{S.scr=s.id;U.sheet=null;render();const b=selfTest();if(b.length)out[s.id]=b});S.scr=keep;render();return out}

<style id="lg-motion">
/* =========================================================
   GymBro · Liquid Glass — motion & material rules
   1. Glass only on the CONTROL layer: tabs, buttons, chips, segments, back, sheets, toasts.
      Content (cards, lists, form fields) = solid tonal surfaces, no backdrop blur.
   2. Container: neighbouring glass controls share one material; the tab "lens" morphs between tabs.
   3. Motion = springs: press squash, release overshoot, lens stretch while travelling.
   4. Haptics on every control tap (vibrate where supported + visual tick).
   5. Fallbacks: no backdrop-filter, reduced transparency, reduced motion.
   ========================================================= */
:root{
  --sp-press:cubic-bezier(.3,0,.5,1);
  --sp-release:cubic-bezier(.34,1.56,.64,1);   /* overshoot */
  --sp-lens:cubic-bezier(.5,1.6,.4,1);
  --solid:#17191E;--solid-2:#1D2026;--solid-rim:rgba(255,255,255,.07);
}
:root[data-theme="light"]{--solid:#FFFFFF;--solid-2:#F6F4F0;--solid-rim:rgba(18,28,58,.08)}

/* ---- 1. content is NOT glass ---- */
.card,.card.pr,.card.coach,.idplate,.opt,.chk,.field,.set.cur,.tile-ic,.av{
  background:var(--solid)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
  border:1px solid var(--solid-rim)!important;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 18px -12px rgba(0,0,0,.5)!important}
.card:before,.opt:before,.field:before{display:none!important}
.card.pr,.card.coach,.idplate{background:linear-gradient(180deg,rgba(46,155,255,.12),rgba(46,155,255,.04)),var(--solid)!important}
.card.hero{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.field{background:var(--solid-2)!important}
.opt.on,.chk.on{border-color:var(--A)!important;box-shadow:0 0 0 1px var(--A) inset!important}
:root[data-theme="light"] :is(.card,.opt,.chk,.field,.set.cur){box-shadow:0 1px 2px rgba(18,28,58,.06),0 8px 20px -14px rgba(18,28,58,.2)!important}

/* ---- 2. tab lens: one glass drop that morphs between tabs ---- */
.tabs{position:relative!important;isolation:isolate}
.tabs button.on{background:transparent!important;box-shadow:none!important}
.lg-lens{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.08),0 4px 14px -4px rgba(0,0,0,.45);
  transition:transform 560ms var(--sp-lens),width 560ms var(--sp-lens),scale 280ms var(--sp-release)}
.lg-lens.moving{scale:1.12 .9}
:root[data-theme="light"] .lg-lens{background:linear-gradient(180deg,#fff,rgba(255,255,255,.75));box-shadow:inset 0 1px 0 #fff,0 3px 10px -3px rgba(15,22,38,.22)}
.tabs button{position:relative;z-index:1}

/* ---- 3. spring press on every glass control ---- */
:is(.btn,.chip,.seg button,.back,.step,.tick,.tabs button,button.pill,.ctrl button){
  transition:transform 520ms var(--sp-release),filter 300ms ease!important}
:is(.btn,.chip,.seg button,.back,.step,.tick,.tabs button,button.pill,.ctrl button):active{
  transform:scale(.94)!important;filter:brightness(1.12);transition:transform 120ms var(--sp-press),filter 120ms!important}
.btn.p:active{transform:scale(.97,.93)!important}

/* glass drops materialize with a liquid overshoot */
@keyframes lgDrop{0%{opacity:0;transform:scale(.82);filter:blur(6px)}60%{opacity:1;transform:scale(1.03);filter:blur(0)}100%{transform:none}}
.scr.fwd :is(.btn,.back,.chip,.seg),.scr.bwd :is(.btn,.back,.chip,.seg){animation:lgDrop 620ms var(--sp-release) both .08s}
.sheet>div{animation:lgSheet 640ms var(--sp-release) both!important}
@keyframes lgSheet{0%{transform:translateY(100%) scaleX(.92);border-radius:60px 60px 0 0}70%{transform:translateY(-2%) scaleX(1.01)}100%{transform:none}}

/* scroll edge: content dissolves under floating glass instead of a hard cut */
.body{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 18px),transparent)}

/* ---- 4. haptic tick (visual echo) ---- */
.lg-tick{position:absolute;border-radius:inherit;inset:-1px;pointer-events:none;z-index:4;box-shadow:0 0 0 0 rgba(255,255,255,.45);animation:lgTick 420ms ease-out forwards}
@keyframes lgTick{to{box-shadow:0 0 0 10px rgba(255,255,255,0)}}

/* ---- 5. fallbacks ---- */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){

    let l=tabs.querySelector('.lg-lens');
    if(!l){l=document.createElement('i');l.className='lg-lens';tabs.prepend(l);
      if(window._lgX!==undefined){l.style.transition='none';l.style.transform=`translateX(${window._lgX}px)`;l.style.width=window._lgW+'px';l._x=window._lgX;l.offsetWidth;l.style.transition='';}}
    const on=tabs.querySelector('button.on');if(!on)return;
    const x=on.offsetLeft,w=on.offsetWidth,prev=l._x;window._lgX=x;window._lgW=w;
    if(prev!==undefined&&prev!==x&&!reduce){l.classList.add('moving');clearTimeout(l._t);l._t=setTimeout(()=>l.classList.remove('moving'),260);}
    l.style.transform=`translateX(${x}px)`;l.style.width=w+'px';l._x=x;
  }
  const sync=()=>document.querySelectorAll('.tabs').forEach(lens);
  new MutationObserver(()=>requestAnimationFrame(sync)).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
  addEventListener('resize',sync);sync();
  // haptics
  document.addEventListener('pointerdown',e=>{
    const c=e.target.closest('.btn,.chip,.seg button,.back,.step,.tick,.tabs button,button.pill,.opt,.chk');if(!c)return;
    if(navigator.vibrate)try{navigator.vibrate(c.matches('.btn.p')?12:6)}catch(_){}
    if(reduce)return;
    const t=document.createElement('span');t.className='lg-tick';
    if(getComputedStyle(c).position==='static')c.style.position='relative';
    c.appendChild(t);setTimeout(()=>t.remove(),450);
  },{passive:true});
})();
</script>
</body>
